<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KILLER-SUDOKU</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/board.css">
</head>
<body>
    <div id="app">
        <!-- 顶部设置栏 -->
        <header class="top-bar">
            <div class="title">KILLER-SUDOKU</div>
            <div class="settings">
                <div class="settings-row">
                    <div class="btn-group" id="size-group">
                        <button class="btn btn-toggle" data-size="4">4×4</button>
                        <button class="btn btn-toggle" data-size="6">6×6</button>
                        <button class="btn btn-toggle active" data-size="9">9×9</button>
                    </div>
                    <select id="difficulty-select" class="select">
                        <option value="beginner">Beginner</option>
                        <option value="easy">Easy</option>
                        <option value="medium">Medium</option>
                        <option value="hard">Hard</option>
                        <option value="expert" selected>Expert</option>
                    </select>
                    <div class="action-group">
                        <button id="new-game-btn" class="btn btn-primary">New</button>
                        <button id="save-btn" class="btn btn-secondary" title="Save current progress">Save</button>
                        <button id="load-btn" class="btn btn-secondary" title="Load saved progress for current size & difficulty" disabled>Load</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- 状态栏 -->
        <div class="status-bar">
            <span id="status-text">Click "New" to start</span>
            <span id="completed-badge" class="badge badge-completed" style="display:none;">Completed</span>
        </div>

        <!-- 提示面板：以公式显示选中格所在宫/笼的数字之和 -->
        <div id="hint-panel" class="hint-panel" style="display:none;">
            <div class="hint-item"><span class="hint-label">Box:</span><span id="hint-box" class="hint-value">0=0</span></div>
            <div class="hint-item"><span class="hint-label">Cage:</span><span id="hint-cage" class="hint-value">0=0</span></div>
            <div class="hint-item"><span class="hint-label">Box cages:</span><span id="hint-box-cages" class="hint-value">0=0</span></div>
            <div class="hint-item"><span class="hint-label">Boxes cages:</span><span id="hint-cage-boxes" class="hint-value">0=0</span></div>
        </div>

        <!-- 棋盘区域 -->
        <main class="board-container">
            <div id="board" class="board"></div>
            <div id="loading" class="loading" style="display:none;">Generating...</div>
        </main>

        <!-- 底部操作区 -->
        <footer class="bottom-bar">
            <div class="bottom-controls">
                <div class="calc-bar calc-off" id="calc-bar">
                    <button id="calc-toggle" class="btn btn-calc btn-calc-toggle" title="Toggle calculator (Shift+Tab)">∑</button>
                    <input type="text" id="calc-display" class="calc-display" value="0" inputmode="numeric" title="Calculator (Shift+Tab): type numbers">
                    <button id="calc-plus" class="btn btn-calc" title="Add (+)">+</button>
                    <button id="calc-minus" class="btn btn-calc" title="Subtract (−)">−</button>
                    <button id="calc-clear" class="btn btn-calc" title="Clear (Backspace)">C</button>
                    <button id="calc-equals" class="btn btn-calc" title="Equals (Enter)">=</button>
                </div>
                <div class="action-row">
                    <button id="undo-btn" class="btn btn-action" title="Undo (Z, up to 3 steps)">
                        <span class="icon">↶</span>
                    </button>
                    <button id="note-btn" class="btn btn-action" title="Note mode (N)">
                        <span class="icon">✎</span>
                    </button>
                    <button id="erase-btn" class="btn btn-action" title="Erase (Esc/Del)">
                        <span class="icon">✕</span>
                    </button>
                    <button id="check-btn" class="btn btn-action" title="Check">
                        <span class="icon">✓</span>
                    </button>
                </div>
            </div>
            <div id="number-pad" class="number-pad"></div>
        </footer>
    </div>

    <script src="./js/storage.js"></script>
    <script src="./puzzles/all-puzzles.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/board.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
